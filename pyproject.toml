[project]
name = "p2-dice"
version = "0.1.0"
description = "Read-only DiCE research and diagnostics for Volvo P2 on macOS."
readme = "README.md"
requires-python = ">=3.13"
license = "GPL-2.0-only"
license-files = ["LICENSE"]
dependencies = ["pyusb>=1.3,<2"]

[project.scripts]
p2-dice = "p2_dice.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "pyright>=1.1,<2",
    "pytest>=9,<10",
    "ruff>=0.16,<0.17",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
